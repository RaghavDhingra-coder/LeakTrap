# LeakTrace email Worker. Not deployed automatically.
# Email Routing rules that send mail to this Worker are configured manually in
# the Cloudflare dashboard; this file defines no routes or triggers.
name = "leaktrace-email"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false

[vars]
# Only recipients exactly at this domain are processed.
ALIAS_DOMAIN = "leaktrap.xyz"
# Public HTTPS URL of the backend's ingest endpoint: the Render service from
# render.yaml, e.g. "https://leaktrace-ingest.onrender.com/ingest/email" (use the
# exact URL Render shows). Cloudflare cannot reach localhost. Must be https.
# While empty, every message goes to FALLBACK_ADDRESS or is refused.
INGEST_URL = ""
# Optional: a verified Email Routing destination address that receives the
# original message whenever the backend does not accept it.
FALLBACK_ADDRESS = ""

# Secret (never put it here): npx wrangler@4 secret put INGEST_SECRET
# It must equal LEAKTRACE_INGEST_SECRET on the backend.
